[package]
name = "snowflake-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Snowflake - Modern AI-powered code editor"

[lints]
workspace = true

[lib]
name = "snowflake_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Workspace crates - common
snowflake-core = { path = "../crates/common/core" }
snowflake-fs = { path = "../crates/common/fs" }
snowflake-lsp = { path = "../crates/common/lsp" }
snowflake-terminal = { path = "../crates/common/terminal" }
snowflake-git = { path = "../crates/common/git" }
snowflake-ai = { path = "../crates/common/ai" }
snowflake-search = { path = "../crates/common/search" }
snowflake-settings = { path = "../crates/common/settings" }
snowflake-conversations = { path = "../crates/common/conversations" }

# Core dependencies
tokio = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
crossbeam-channel = { workspace = true }
hashbrown = { workspace = true }

# Tauri
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
