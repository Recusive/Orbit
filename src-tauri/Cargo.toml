[package]
name = "orbit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Orbit - Modern AI-powered code editor"

[lints]
workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Workspace crates - common
orbit-core = { path = "../crates/common/core" }
orbit-fs = { path = "../crates/common/fs" }
orbit-lsp = { path = "../crates/common/lsp" }
orbit-terminal = { path = "../crates/common/terminal" }
orbit-git = { path = "../crates/common/git" }
orbit-ai = { path = "../crates/common/ai" }
orbit-search = { path = "../crates/common/search" }
orbit-settings = { path = "../crates/common/settings" }
orbit-conversations = { path = "../crates/common/conversations" }
orbit-sf-symbols = { path = "../crates/common/sf-symbols" }

# Core dependencies
tokio = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
urlencoding = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
hashbrown = { workspace = true }
hostname = "0.4"  # For non-macOS device ID generation
regex = "1"  # Component name validation
ignore = { workspace = true } # Workspace doc discovery for Vault
tempfile = { workspace = true }

# Tauri
tauri = { workspace = true, features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
whoami = "2.1"
# Local fork with fix for decoration-less windows (original crashes)
orbit-plugin-decorum = { path = "../crates/plugins/decorum" }
tauri-plugin-window-state = "2"
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }

# Error tracking
sentry = { workspace = true }

# Window effects
tauri-plugin-liquid-glass = "0.1"

[dev-dependencies]
tokio-test = "0.4"
