[package]
name = "orbit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Orbit - Modern AI-powered code editor"

[lints]
workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Workspace crates - common
orbit-core = { path = "../crates/common/core" }
orbit-fs = { path = "../crates/common/fs" }
orbit-lsp = { path = "../crates/common/lsp" }
orbit-terminal = { path = "../crates/common/terminal" }
orbit-git = { path = "../crates/common/git" }
orbit-ai = { path = "../crates/common/ai" }
orbit-search = { path = "../crates/common/search" }
orbit-settings = { path = "../crates/common/settings" }
orbit-conversations = { path = "../crates/common/conversations" }

# Core dependencies
tokio = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
crossbeam-channel = { workspace = true }
hashbrown = { workspace = true }
hostname = "0.4"  # For non-macOS device ID generation

# Tauri
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-log = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
whoami = "2.0.0"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-window-state = "2"
