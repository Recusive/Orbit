name: CI

on:
  push:
    branches: [main, develop, port, feat/pranit]
  pull_request:
    branches: [main, develop, port, feat/pranit]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  BUN_VERSION: 'latest'
  CARGO_TERM_COLOR: always
  CENTRAL_LICENSE_KEY: '38A7449F-8FCA-45E9-8FA4-E2C656E0F3AE'

jobs:
  # ============================================
  # Frontend - Agent (TypeScript/React)
  # ============================================
  typecheck:
    name: TypeScript (Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: ESLint (All Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # Vitest tests for all frontend apps (agent, canvas, editor, common)
  vitest:
    name: Vitest (All Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build (Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      # Only upload artifacts on main branch to save storage
      # continue-on-error prevents storage quota issues from failing the build
      - name: Upload build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dist-agent-${{ github.sha }}
          path: dist/
          retention-days: 3

  # ============================================
  # Frontend - Common (Shared Types/Utils)
  # ============================================
  common-typecheck:
    name: TypeScript (Common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run common:typecheck

  # ============================================
  # Frontend - Shared Schemas (Zod Schemas)
  # ============================================
  schemas-typecheck:
    name: TypeScript (Schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run schemas:typecheck

  # ============================================
  # Frontend - Canvas (TypeScript/React + Bun)
  # ============================================
  canvas-typecheck:
    name: TypeScript (Canvas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run canvas:typecheck

  canvas-build:
    name: Build (Canvas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run canvas:build

      # Only upload artifacts on main branch to save storage
      - name: Upload build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dist-canvas-${{ github.sha }}
          path: dist/canvas/
          retention-days: 3

  # ============================================
  # Agent Bridge (TypeScript/Bun Sidecar)
  # ============================================
  bridge-typecheck:
    name: TypeScript (Bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run bridge:typecheck

  bridge-test:
    name: Test (Bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run bridge:test

  # ============================================
  # Backend - Rust/Tauri
  # ============================================
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Create placeholder binaries for CI
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/agent-bridge-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/claude-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/orbit-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Create placeholder binaries for CI
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/agent-bridge-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/claude-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/orbit-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  rust-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Create placeholder binaries for CI
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/agent-bridge-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/claude-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/orbit-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check

  rust-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Create placeholder binaries for CI
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/agent-bridge-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/claude-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/orbit-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: bnjbvr/cargo-machete@main

  rust-doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Create placeholder binaries for CI
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/agent-bridge-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/claude-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/orbit-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  rust-msrv:
    name: MSRV Check (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lld libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Create placeholder binaries for CI
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/agent-bridge-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/claude-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/orbit-server-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - run: cargo check --all-features

