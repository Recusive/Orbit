[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/snowflake-core",
    "crates/snowflake-fs",
    "crates/snowflake-lsp",
    "crates/snowflake-terminal",
    "crates/snowflake-git",
    "crates/snowflake-ai",
    "crates/snowflake-search",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Snowflake Team"]
license = "MIT"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system
notify = "8"
walkdir = "2"
globset = "0.4"

# Terminal
portable-pty = "0.8"

# Git
gix = { version = "0.69", default-features = false, features = ["basic", "status"] }

# LSP
tower-lsp = "0.20"
lsp-types = "0.97"

# Search
grep = "0.3"
ignore = "0.4"

# HTTP client (for AI)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Tauri
tauri = "2.9"
tauri-build = "2.5"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
