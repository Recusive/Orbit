<text x="374.725" y="58" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">A new message streams in</text>
<text x="374.725" y="849" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#fff">&quot;Time passes...&lt;br/&gt;user scrolls, closes app,&lt;br/&gt;reopens, etc.&quot;</text>
<text x="374.725" y="1785" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;No re-measuring&lt;br/&gt;No scroll jitter&lt;br/&gt;No blank gaps&lt;br/&gt;No overlaps&quot;</text>
<text x="374.725" y="214" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Row renders in the DOM&lt;br/&gt;markdown parses,&lt;br/&gt;Shiki colors the code&quot;</text>
<text x="374.725" y="370" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Wait 500ms without&lt;br/&gt;any size changes&lt;br/&gt;(row is &#39;settled&#39;)&quot;</text>
<text x="374.725" y="526" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Capture the final height&lt;br/&gt;+ the rendered HTML&quot;</text>
<text x="374.725" y="687.5" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Save to IndexedDB&lt;br/&gt;• row height → render cache&lt;br/&gt;• HTML → streamdown cache&quot;</text>
<text x="374.725" y="1005" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Load heights from IndexedDB&lt;br/&gt;on session open&quot;</text>
<text x="374.725" y="1161" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;TanStack asks:&lt;br/&gt;&#39;how tall is each row?&#39;&quot;</text>
<text x="374.725" y="1317" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Return the cached height&lt;br/&gt;instead of measuring again&quot;</text>
<text x="374.725" y="1473" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Row gets positioned&lt;br/&gt;at its exact final height&lt;br/&gt;from the very first frame&quot;</text>
<text x="374.725" y="1629" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="#1a1b26">&quot;Row&#39;s HTML is injected&lt;br/&gt;instantly from cache&lt;br/&gt;(no markdown parse, no Shiki)&quot;</text>
</svg>