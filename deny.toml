[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
db-path = "~/.cargo/advisory-db"
# Unmaintained crates that are transitive deps from Tauri
# No safe upgrade available - Tauri needs to update their dependencies
ignore = [
    # fxhash is unmaintained but still widely used, no security issue
    { id = "RUSTSEC-2025-0057", reason = "fxhash - transitive dep from Tauri, no security issue" },
    # unic-* crates are all unmaintained, used by urlpattern in Tauri
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range - transitive dep from Tauri/urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common - transitive dep from Tauri/urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property - transitive dep from Tauri/urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version - transitive dep from Tauri/urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident - transitive dep from Tauri/urlpattern" },
    # rand 0.8.5 unsoundness with custom logger - transitive dep from Tauri
    { id = "RUSTSEC-2026-0097", reason = "rand - transitive dep from Tauri, no custom logger in use" },
    # rustls-webpki 0.103.x certificate validation - transitive dep from Tauri/reqwest
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki - transitive dep from Tauri/reqwest" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki - transitive dep from Tauri/reqwest" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki - transitive dep from Tauri/reqwest" },
    # tar 0.4.44 symlink/PAX issues - transitive dep from Tauri
    { id = "RUSTSEC-2026-0067", reason = "tar - transitive dep from Tauri, not used for untrusted archives" },
    { id = "RUSTSEC-2026-0068", reason = "tar - transitive dep from Tauri, not used for untrusted archives" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
# Allow wildcards for workspace members (they use version = "*" internally)
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
